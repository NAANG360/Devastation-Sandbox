name: Godot Android Gradle Build

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/android-gradle-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-gradle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-debug:
    name: Export Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout project and Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The previous run failed here because android-actions/setup-android@v3
      # attempted to install the obsolete SDK package "tools". Use the runner's
      # installed command-line tools directly and install only valid package IDs.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Download Godot 4.7.1 editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot/bin" "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot/bin" -maxdepth 1 -type f -iname 'Godot*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --headless --version

      - name: Install matching Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/godot/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot/templates"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          test -d "$RUNNER_TEMP/godot/templates/templates"
          cp -a "$RUNNER_TEMP/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.1.stable/"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('export_presets.cfg', 'project.godot') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Validate project and import assets
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f export_presets.cfg
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --import
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --quit

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" \
            --export-debug "Devastation Sandbox" \
            "artifacts/DevastationSandbox-v0.69.50-debug.apk"
          test -s artifacts/DevastationSandbox-v0.69.50-debug.apk
          file artifacts/DevastationSandbox-v0.69.50-debug.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DevastationSandbox-v0.69.50-android-debug
          path: artifacts/DevastationSandbox-v0.69.50-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-android-build-diagnostics
          path: |
            ~/.gradle/daemon/
            ~/.local/share/godot/
          if-no-files-found: ignore
          retention-days: 7
